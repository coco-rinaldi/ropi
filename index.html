<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf6f1">
<title>RO PONCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ===== PALETA — cambiá acá ===== */
  :root{
    --bg:#fbf6f1;          /* fondo crema */
    --surface:#ffffff;     /* tarjetas */
    --text:#1a1420;        /* texto principal */
    --muted:#564c60;       /* texto secundario (contraste AA) */
    --accent:#c8205f;      /* rosa fuerte (AA sobre claro) */
    --accent2:#5b3fc4;     /* violeta (AA sobre claro) */
    --soft1:#ffd3e4;       /* rosa pastel fondo */
    --soft2:#ded4ff;       /* lila pastel fondo */
    --chrome:#c9ccd6;
    --ink:#1a1420;         /* detalles de gatitos */
    --line:rgba(26,20,32,.2);
    --cat:#ffffff;
    --serif:'Instrument Serif', Georgia, serif;
    --mono:'Space Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{font-size:16px;-webkit-text-size-adjust:100%}
  html,body{background:var(--bg);color:var(--text)}
  body{
    font-family:var(--mono);font-size:1rem;line-height:1.45;
    min-height:100dvh;overflow-x:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  :focus-visible{outline:3px solid var(--accent2);outline-offset:3px;border-radius:10px}

  /* ===== FONDO ===== */
  .bg{position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(55% 40% at 90% 5%, var(--soft1), transparent 70%),
      radial-gradient(55% 40% at 0% 75%, var(--soft2), transparent 70%),
      var(--bg);
  }
  .bg::before{content:"";position:absolute;inset:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:48px 48px;opacity:.35;
    mask-image:linear-gradient(180deg,transparent,#000 25%,#000 75%,transparent)}

  /* ===== GATITOS ===== */
  .cats{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
  .cat{position:absolute;width:var(--s,90px);height:var(--s,90px);
    animation:bob var(--d,2.4s) ease-in-out infinite;transform:rotate(var(--r,0deg))}
  .cat svg{width:100%;height:100%}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -6px}}
  @media (prefers-reduced-motion:reduce){.cat{animation:none}}

  /* ===== LAYOUT ===== */
  main{max-width:640px;margin:0 auto;padding:24px 18px 64px}
  header{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 0 30px}
  .logo{width:min(80vw,340px);height:auto;display:block}
  .logo-fallback{font-family:var(--serif);font-weight:400;font-size:clamp(58px,17vw,100px);line-height:.9;text-align:center;letter-spacing:-.02em}
  .logo-fallback i{color:var(--accent)}
  .meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.875rem;font-weight:700;text-transform:uppercase;letter-spacing:.16em}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.3}}

  .week{
    background:var(--surface);border:2px solid var(--text);border-radius:22px;
    padding:22px 20px;margin-bottom:36px;box-shadow:6px 6px 0 var(--accent);
    font-family:var(--serif);font-size:clamp(28px,7.5vw,38px);line-height:1.12;
  }
  .week b{font-weight:400;font-style:italic;color:var(--accent)}
  .week:empty{display:none}

  section{margin-bottom:44px}
  .sh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-bottom:2px solid var(--text);padding-bottom:10px;margin-bottom:18px}
  .sh h2{font-family:var(--serif);font-weight:400;font-size:clamp(44px,12vw,60px);line-height:.85;letter-spacing:-.02em;display:flex;align-items:flex-end;gap:8px}
  .sh h2 em{color:var(--accent2)}
  .sh h2 .mini{width:50px;height:50px;flex:none}
  .idx{color:var(--muted);font-size:.875rem;font-weight:700;letter-spacing:.16em}
  .icon-btn{min-height:44px;background:var(--surface);border:2px solid var(--text);color:var(--text);border-radius:999px;padding:8px 16px;font:inherit;font-size:.8125rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
  .icon-btn.on{background:var(--text);color:var(--surface)}

  /* ===== RECURSOS ===== */
  .res{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .rb{
    display:flex;flex-direction:column;justify-content:space-between;gap:20px;
    min-height:100px;padding:16px;border-radius:18px;border:2px solid var(--text);
    background:var(--surface);color:var(--text);font:inherit;text-align:left;cursor:pointer;
    transition:transform .15s, background .2s, color .2s;
  }
  .rb:active{transform:scale(.97)}
  .rb .n{font-family:var(--serif);font-size:1.75rem;line-height:1}
  .rb .t{font-size:.8125rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
  .rb.has .t span:last-child{color:var(--accent)}
  .rb.done{background:var(--accent);border-color:var(--accent);color:#fff}
  .rb.done .t,.rb.done .t span{color:#fff}
  .rb input{width:100%;background:var(--bg);border:2px solid var(--line);border-radius:10px;color:var(--text);font:inherit;font-size:1rem;padding:10px;outline:none}
  .rb input:focus{border-color:var(--accent2)}

  /* ===== FECHAS ===== */
  form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
  form .full{grid-column:1/-1}
  .f{display:flex;flex-direction:column;gap:6px}
  .f label{font-size:.8125rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .f input{
    background:var(--surface);border:2px solid var(--text);border-radius:14px;
    color:var(--text);font:inherit;font-size:1.0625rem;padding:13px 14px;min-height:52px;outline:none;width:100%;
    color-scheme:light;
  }
  .f input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px var(--soft2)}
  .actions{grid-column:1/-1;display:flex;gap:10px}
  .btn{flex:1;min-height:54px;border:2px solid var(--text);border-radius:999px;padding:14px;font:inherit;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:.9375rem;cursor:pointer}
  .btn.p{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.s{background:var(--surface);color:var(--text);flex:0 0 auto;padding:14px 22px}
  .btn:active{transform:scale(.98)}

  .gigs{list-style:none;display:flex;flex-direction:column;gap:10px}
  .gig{display:grid;grid-template-columns:66px 1fr auto;gap:14px;align-items:center;padding:14px;background:var(--surface);border:2px solid var(--line);border-radius:18px}
  .gig.wk{border-color:var(--accent)}
  .gig.past{opacity:.55}
  .gig.wk .day{color:var(--accent)}
  .day{font-family:var(--serif);font-size:3rem;line-height:.8;text-align:center}
  .day small{display:block;font-family:var(--mono);font-size:.8125rem;font-weight:700;letter-spacing:.1em;margin-top:8px;color:var(--muted)}
  .gi .pl{font-family:var(--serif);font-size:1.6rem;line-height:1.05;word-break:break-word}
  .gi .lu{color:var(--muted);font-size:.9375rem;margin-top:4px}
  .ga{display:flex;gap:6px}
  .ga button{width:46px;height:46px;border-radius:50%;border:2px solid var(--text);background:var(--surface);color:var(--text);font-size:1.15rem;cursor:pointer}
  .ga button:active{background:var(--text);color:var(--surface)}
  .empty{display:flex;align-items:center;gap:12px;color:var(--muted);padding:12px 0;font-size:.9375rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  .empty svg{width:64px;height:64px}

  footer{display:flex;justify-content:center;gap:22px;padding-top:16px}
  footer button{min-height:44px;background:none;border:0;color:var(--muted);font:inherit;font-size:.875rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;text-decoration:underline;text-underline-offset:5px}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));translate:-50% 30px;opacity:0;
    background:var(--text);color:var(--surface);padding:14px 22px;border-radius:999px;font-size:.9375rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    transition:.25s;pointer-events:none;z-index:10;white-space:nowrap}
  .toast.show{translate:-50% 0;opacity:1}

  @media (min-width:760px){
    main{padding-top:48px}
    .res{grid-template-columns:repeat(3,1fr)}
    form{grid-template-columns:180px 1fr 1fr}
    form .full{grid-column:auto}
  }
</style>
</head>
<body>

<!-- gatito DJ original, con contorno para fondo claro -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="djcat" viewBox="0 0 120 120">
    <path d="M38 94 Q36 66 60 64 Q84 66 82 94Z" style="fill:var(--cat);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round"/>
    <path d="M34 36 L39 13 L53 28 Q60 26 67 28 L81 13 L86 36 Q93 50 84 59 Q74 69 60 69 Q46 69 36 59 Q27 50 34 36Z" style="fill:var(--cat);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round"/>
    <path d="M41 19 L44 30 L50 27Z M79 19 L76 30 L70 27Z" style="fill:var(--accent)"/>
    <ellipse cx="50" cy="46" rx="3.2" ry="4.2" style="fill:var(--ink)"/>
    <ellipse cx="70" cy="46" rx="3.2" ry="4.2" style="fill:var(--ink)"/>
    <path d="M57.5 53 L62.5 53 L60 56Z" style="fill:var(--accent)"/>
    <path d="M60 56 Q57 60 54 58 M60 56 Q63 60 66 58" style="fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round"/>
    <path d="M29 48 Q29 9 60 9 Q91 9 91 48" style="fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round"/>
    <rect x="22" y="40" width="12" height="18" rx="5" style="fill:var(--accent2);stroke:var(--ink);stroke-width:2"/>
    <rect x="86" y="40" width="12" height="18" rx="5" style="fill:var(--accent2);stroke:var(--ink);stroke-width:2"/>
    <rect x="8" y="88" width="104" height="26" rx="5" style="fill:var(--ink)"/>
    <g>
      <circle cx="31" cy="101" r="10" style="fill:#2a2230;stroke:var(--chrome);stroke-width:1"/>
      <line x1="31" y1="101" x2="31" y2="92.5" style="stroke:var(--chrome);stroke-width:1.2"/>
      <circle cx="31" cy="101" r="3" style="fill:var(--accent)"/>
      <animateTransform attributeName="transform" type="rotate" from="0 31 101" to="360 31 101" dur="1.4s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="89" cy="101" r="10" style="fill:#2a2230;stroke:var(--chrome);stroke-width:1"/>
      <line x1="89" y1="101" x2="89" y2="92.5" style="stroke:var(--chrome);stroke-width:1.2"/>
      <circle cx="89" cy="101" r="3" style="fill:var(--soft2)"/>
      <animateTransform attributeName="transform" type="rotate" from="0 89 101" to="360 89 101" dur="1.4s" repeatCount="indefinite"/>
    </g>
    <rect x="52" y="99" width="16" height="3" rx="1.5" style="fill:var(--chrome)"/>
    <rect x="57" y="96" width="6" height="9" rx="1.5" style="fill:var(--accent)"/>
    <ellipse cx="45" cy="89" rx="6" ry="4" style="fill:var(--cat);stroke:var(--ink);stroke-width:2"/>
    <ellipse cx="75" cy="89" rx="6" ry="4" style="fill:var(--cat);stroke:var(--ink);stroke-width:2"/>
  </symbol>
</svg>

<div class="bg"></div>
<div class="cats" id="cats" aria-hidden="true"></div>

<main>
  <header>
    <img class="logo" src="logo.png" alt="RO PONCE"
         onerror="this.outerHTML='<h1 class=&quot;logo-fallback&quot;>RO <i>PONCE</i></h1>'">
    <div class="meta"><span class="dot"></span><span>dj</span><span>·</span><span id="today"></span></div>
  </header>

  <div class="week" id="week" aria-live="polite"></div>

  <section>
    <div class="sh">
      <h2><svg class="mini" aria-hidden="true"><use href="#djcat"/></svg>re<em>cursos</em></h2>
      <button class="icon-btn" id="editRes">links</button>
    </div>
    <div class="res" id="res"></div>
  </section>

  <section>
    <div class="sh">
      <h2><svg class="mini" aria-hidden="true" style="--cat:var(--soft2)"><use href="#djcat"/></svg>fe<em>chas</em></h2>
      <span class="idx" id="count">00</span>
    </div>

    <form id="form" autocomplete="off">
      <div class="f"><label for="fDate">fecha</label><input type="date" id="fDate" required></div>
      <div class="f"><label for="fPlace">lugar</label><input type="text" id="fPlace" required></div>
      <div class="f full"><label for="fLine">line up</label><input type="text" id="fLine"></div>
      <div class="actions">
        <button type="submit" class="btn p" id="submit">cargar</button>
        <button type="button" class="btn s" id="cancel" hidden aria-label="cancelar">×</button>
      </div>
    </form>

    <ul class="gigs" id="gigs"></ul>
  </section>

  <footer>
    <button id="exp">exportar</button>
    <button id="imp">importar</button>
    <input type="file" id="impFile" accept="application/json" hidden>
  </footer>
</main>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const K_GIGS = 'roponce.gigs.v1';
  const K_RES  = 'roponce.res.v1';

  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { toast('no se pudo guardar'); } };

  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ===== gatitos de fondo (suaves para no competir con el texto) =====
  const catSpots = [
    {t:'5%',  l:'-5%', s:110, r:-12, d:2.2, o:.75},
    {t:'3%',  l:'78%', s:86,  r:10,  d:2.8, o:.7,  c:'var(--soft1)'},
    {t:'38%', l:'87%', s:96,  r:-6,  d:2.4, o:.35, c:'var(--soft2)'},
    {t:'54%', l:'-7%', s:90,  r:14,  d:3.0, o:.35, c:'var(--soft1)'},
    {t:'76%', l:'81%', s:118, r:-10, d:2.6, o:.6},
    {t:'89%', l:'3%',  s:80,  r:8,   d:2.1, o:.6,  c:'var(--soft2)'}
  ];
  $('#cats').innerHTML = catSpots.map(c =>
    `<div class="cat" style="top:${c.t};left:${c.l};--s:${c.s}px;--r:${c.r}deg;--d:${c.d}s;opacity:${c.o};${c.c?`--cat:${c.c}`:''}"><svg><use href="#djcat"/></svg></div>`
  ).join('');

  // ===== fechas utils =====
  const DOW = ['dom','lun','mar','mié','jue','vie','sáb'];
  const MON = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
  const today0 = () => { const t = new Date(); t.setHours(0,0,0,0); return t; };
  const endOfWeek = () => { const t = today0(); const sun = new Date(t); sun.setDate(t.getDate() + ((7 - t.getDay()) % 7)); return sun; };

  const t = new Date();
  $('#today').textContent = `${DOW[t.getDay()]} ${t.getDate()} ${MON[t.getMonth()]}`;

  // ===== recursos =====
  const RES = [
    {id:'soundcloud', n:'SoundCloud'},
    {id:'mixcloud',   n:'Mixcloud'},
    {id:'whatsapp',   n:'WhatsApp'},
    {id:'instagram',  n:'Instagram'},
    {id:'presskit',   n:'Presskit'},
    {id:'fotos',      n:'Fotos'}
  ];
  let links = load(K_RES, {});
  let editing = false;

  function renderRes(){
    $('#res').innerHTML = RES.map(r => {
      const url = links[r.id] || '';
      if (editing) return `<div class="rb"><label class="n" for="in-${r.id}">${r.n}</label>
        <input id="in-${r.id}" data-id="${r.id}" type="url" inputmode="url" placeholder="pegá el link" value="${esc(url)}"></div>`;
      return `<button class="rb ${url?'has':''}" data-id="${r.id}">
        <span class="n">${r.n}</span>
        <span class="t"><span>${url?'copiar':'—'}</span><span>${url?'●':''}</span></span></button>`;
    }).join('');
  }

  $('#res').addEventListener('input', e => {
    const id = e.target.dataset.id; if (!id) return;
    links[id] = e.target.value.trim(); save(K_RES, links);
  });

  $('#res').addEventListener('click', async e => {
    if (editing) return;
    const b = e.target.closest('.rb'); if (!b) return;
    const url = links[b.dataset.id];
    if (!url) { toast('todavía sin link'); return; }
    await copy(url);
    b.classList.add('done'); setTimeout(()=>b.classList.remove('done'), 700);
    toast('copiado ✓');
  });

  $('#editRes').addEventListener('click', e => {
    editing = !editing;
    e.currentTarget.classList.toggle('on', editing);
    e.currentTarget.textContent = editing ? 'listo' : 'links';
    renderRes();
  });

  async function copy(txt){
    try { await navigator.clipboard.writeText(txt); }
    catch {
      const ta = document.createElement('textarea'); ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
  }

  // ===== fechas =====
  let gigs = load(K_GIGS, []);
  let editId = null;

  function weekMsg(){
    const a = today0(), b = endOfWeek();
    const wk = gigs.filter(g => { const d = parse(g.date); return d >= a && d <= b; })
                   .sort((x,y) => x.date.localeCompare(y.date));
    if (!wk.length) return '';
    const parts = wk.map(g => `en <b>${esc(g.place)}</b>` + (g.lineup ? ` con ${esc(g.lineup)}` : ''));
    const joined = parts.length === 1 ? parts[0]
      : parts.slice(0,-1).join(', ') + ', y ' + parts[parts.length-1];
    return `esta semana tocás ${joined} &lt;3!`;
  }

  function renderGigs(){
    const a = today0(), b = endOfWeek();
    const sorted = [...gigs].sort((x,y) => {
      const px = parse(x.date) < a, py = parse(y.date) < a;
      if (px !== py) return px ? 1 : -1;
      return px ? y.date.localeCompare(x.date) : x.date.localeCompare(y.date);
    });
    const up = gigs.filter(g => parse(g.date) >= a).length;
    $('#count').textContent = String(up).padStart(2,'0');

    $('#gigs').innerHTML = sorted.length ? sorted.map(g => {
      const d = parse(g.date), past = d < a, wk = !past && d <= b;
      return `<li class="gig ${past?'past':''} ${wk?'wk':''}">
        <div class="day">${d.getDate()}<small>${DOW[d.getDay()]} ${MON[d.getMonth()]}</small></div>
        <div class="gi"><div class="pl">${esc(g.place)}</div>${g.lineup?`<div class="lu">${esc(g.lineup)}</div>`:''}</div>
        <div class="ga"><button data-e="${g.id}" aria-label="editar ${esc(g.place)}">✎</button><button data-d="${g.id}" aria-label="eliminar ${esc(g.place)}">×</button></div>
      </li>`;
    }).join('') : `<li class="empty"><svg aria-hidden="true"><use href="#djcat"/></svg>sin fechas</li>`;

    $('#week').innerHTML = weekMsg();
  }

  function resetForm(){
    editId = null; $('#form').reset();
    $('#submit').textContent = 'cargar'; $('#cancel').hidden = true;
  }

  $('#form').addEventListener('submit', e => {
    e.preventDefault();
    const g = { date: $('#fDate').value, place: $('#fPlace').value.trim(), lineup: $('#fLine').value.trim() };
    if (!g.date || !g.place) return;
    if (editId) { gigs = gigs.map(x => x.id === editId ? {...x, ...g} : x); toast('actualizado'); }
    else { gigs.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), ...g }); toast('cargado ✓'); }
    save(K_GIGS, gigs); resetForm(); renderGigs();
  });

  $('#cancel').addEventListener('click', resetForm);

  $('#gigs').addEventListener('click', e => {
    const ed = e.target.closest('[data-e]'), dl = e.target.closest('[data-d]');
    if (ed) {
      const g = gigs.find(x => x.id === ed.dataset.e); if (!g) return;
      editId = g.id; $('#fDate').value = g.date; $('#fPlace').value = g.place; $('#fLine').value = g.lineup || '';
      $('#submit').textContent = 'guardar'; $('#cancel').hidden = false;
      $('#form').scrollIntoView({behavior:'smooth', block:'center'});
    }
    if (dl) {
      const g = gigs.find(x => x.id === dl.dataset.d); if (!g) return;
      if (!confirm(`¿eliminar ${g.place}?`)) return;
      gigs = gigs.filter(x => x.id !== g.id); save(K_GIGS, gigs);
      if (editId === g.id) resetForm();
      renderGigs(); toast('eliminado');
    }
  });

  // ===== backup =====
  $('#exp').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({gigs, links}, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `roponce-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $('#imp').addEventListener('click', () => $('#impFile').click());
  $('#impFile').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (Array.isArray(data.gigs)) { gigs = data.gigs; save(K_GIGS, gigs); }
      if (data.links && typeof data.links === 'object') { links = data.links; save(K_RES, links); }
      renderGigs(); renderRes(); toast('importado ✓');
    } catch { toast('archivo inválido'); }
    e.target.value = '';
  });

  // ===== toast =====
  let tt;
  function toast(m){ const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(()=>el.classList.remove('show'), 1600); }

  renderRes(); renderGigs();
})();
</script>
</body>
</html>
