<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf5f1">
<title>RO PONCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#fbf5f1;--paper:#fffaf7;--ink:#241b27;--muted:#827487;--pink:#d7357c;--violet:#8068bd;--blush:#f5dce8;--line:rgba(36,27,39,.16);--serif:'Instrument Serif',Georgia,serif;--mono:'Space Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--mono);line-height:1.5;text-align:center}
button,input{font:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.hidden{display:none!important}
.cat{display:block;image-rendering:pixelated;animation:bob 3.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.cats{display:flex;justify-content:center;align-items:center;gap:16px;margin:18px 0}
.backdrop{position:fixed;inset:0;z-index:-3;background:radial-gradient(ellipse at 88% 4%,#f6dce7 0,transparent 34%),radial-gradient(ellipse at 3% 67%,#ece5f6 0,transparent 36%),var(--bg)}
.decor{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
main{width:min(100% - 34px,560px);margin:auto;padding:26px 0 40px}
header{padding:8px 0 4px}
.logo{display:block;width:min(70vw,280px);height:auto;margin:auto}
.logo-fallback{font:clamp(60px,16vw,96px)/.88 var(--serif);letter-spacing:-.055em}
.logo-fallback i{color:var(--pink)}
.meta{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px;color:var(--muted);font-size:.7rem;letter-spacing:.12em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--pink);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.track{position:relative;margin:8px 0 46px;padding:22px 18px 18px;border:1px solid var(--ink);background:rgba(255,250,247,.85);box-shadow:5px 5px 0 var(--blush)}
.eyebrow{font-size:.68rem;letter-spacing:.12em;color:var(--pink);font-weight:700}
.track-title{font:italic clamp(28px,7vw,38px)/1.03 var(--serif);margin:8px 0 4px;cursor:pointer}
.track-meta{font-size:.72rem;color:var(--muted);overflow-wrap:anywhere;cursor:pointer}
.track-open{display:inline-block;margin-top:14px;text-decoration:none}
.track-edit{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
input{width:100%;min-width:0;border:1px solid #b9aebe;border-radius:3px;padding:12px;background:#fff;color:var(--ink);font-size:16px}
.btn{display:inline-block;border:1px solid var(--ink);border-radius:2px;min-height:44px;padding:10px 18px;background:transparent;color:var(--ink);font-size:.72rem;font-weight:700;letter-spacing:.08em}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}
.actions{display:flex;justify-content:center;gap:9px}
.actions .btn{flex:1;max-width:190px}
.section{margin-bottom:46px}
.section-head{display:flex;flex-direction:column;align-items:center;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:16px;margin-bottom:18px}
.sh-title{display:flex;align-items:center;justify-content:center;gap:18px}
.sh-title h2{font:clamp(46px,12vw,64px)/.9 var(--serif);letter-spacing:-.045em}
.sh-title h2 em{color:var(--violet);font-weight:400}
.sh-tools{display:flex;align-items:center;gap:12px}
.count{font-size:.72rem;letter-spacing:.1em;color:var(--muted);font-weight:700}
.add{width:44px;height:44px;border-radius:50%;background:var(--paper);border:1px solid var(--ink);font-size:1.7rem;line-height:1;box-shadow:3px 3px 0 var(--blush)}
.resource-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.resource{min-height:84px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(255,250,247,.78);border:1px solid rgba(36,27,39,.45);border-radius:3px;color:var(--ink)}
.resource:active{transform:translateY(2px)}
.resource span{font:1.5rem/1.1 var(--serif);overflow-wrap:anywhere}
.resource small{font-size:.62rem;color:var(--muted);letter-spacing:.06em}
.resource-edit{display:flex;flex-direction:column;gap:7px;background:var(--paper);border:1px solid var(--ink);border-radius:3px;padding:10px}
.resource-edit label{font:1.25rem var(--serif)}
.resource-edit input{padding:9px;font-size:14px}
form#gigForm{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.66rem;letter-spacing:.1em;color:var(--muted);font-weight:700}
.field.full,form#gigForm .actions{grid-column:1/-1}
.gigs{list-style:none;display:grid;gap:10px}
.gig{position:relative;padding:16px 62px 14px;background:rgba(255,250,247,.8);border:1px solid var(--line);border-radius:3px}
.gig.thisweek{border-color:var(--pink);box-shadow:3px 3px 0 var(--blush)}
.gig.past{opacity:.55}
.gcat{position:absolute;left:8px;top:10px}
.day{font:3rem/.85 var(--serif)}
.dmeta{font-size:.66rem;letter-spacing:.1em;color:var(--muted);margin:6px 0 8px}
.gig-place{font:1.6rem/1.05 var(--serif);overflow-wrap:anywhere}
.gig-lineup{font-size:.72rem;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.gig-actions{display:flex;justify-content:center;gap:8px;margin-top:12px}
.gig-actions button{width:36px;height:36px;border:1px solid var(--ink);border-radius:50%;background:var(--paper);color:var(--ink);font-size:1rem}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;color:var(--muted);font-size:.72rem;letter-spacing:.1em}
footer{padding:4px 0 6px}
footer button{border:0;background:none;color:var(--muted);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-decoration:underline;text-underline-offset:5px;padding:10px}
.sync-status{color:var(--muted);font-size:.62rem;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;border-radius:999px;padding:12px 17px;font-size:.7rem;z-index:99;transition:.2s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.auth-screen{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}
.auth-card{width:min(100%,390px);background:var(--paper);border:1px solid var(--ink);border-radius:4px;padding:26px;box-shadow:7px 7px 0 var(--blush)}
.auth-card h1{font:italic 52px/.95 var(--serif);margin-bottom:10px}
.auth-card h1 span{color:var(--pink)}
.auth-card p{font-size:.72rem;color:var(--muted)}
.auth-card label{display:block;font-size:.66rem;font-weight:700;letter-spacing:.1em;margin:14px 0 6px}
.auth-card .btn{width:100%;margin-top:18px}
.auth-error{color:#b51e54;font-size:.7rem;margin-top:11px;min-height:1.1em}
.modal{position:fixed;inset:0;z-index:85;background:rgba(36,23,39,.45);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.modal-card{width:min(100%,420px);max-height:92dvh;background:var(--paper);border:1px solid var(--ink);border-radius:5px;padding:24px 18px 26px;box-shadow:8px 8px 0 var(--blush)}
.modal-kicker{font-size:.68rem;letter-spacing:.18em;font-weight:700;color:var(--pink)}
.modal-card .cats{margin:14px 0 8px;gap:10px}
.modal-message{font:italic clamp(32px,8vw,42px)/1.05 var(--serif);margin:8px 0 24px}
.modal-buttons{display:flex;justify-content:center;align-items:center;gap:12px;min-height:48px}
.modal-buttons .btn{min-width:124px}
#nopSlot{width:124px;height:46px;flex:none;position:relative}
#nop{width:124px;background:var(--paper);transition:left .25s,top .25s}
#ofquers{background:var(--pink);border-color:var(--pink);color:#fff}
@media(min-width:600px){main{padding-top:36px}.resource-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:390px){.gig{padding:14px 52px 12px}.sh-title{gap:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="decor" id="decor" aria-hidden="true"></div>

<div class="auth-screen" id="authScreen">
 <div class="auth-card">
  <div class="cats" style="margin-top:0"><span data-cat="phones" data-s="3"></span><span data-cat="heart" data-s="3"></span></div>
  <h1>RO <span>PONCE</span></h1>
  <p>fechas, música y links compartidos<br>entrás con tu propio usuario</p>
  <form id="loginForm">
   <label for="email">email</label><input id="email" type="email" autocomplete="username" placeholder="tu email" required>
   <label for="password">contraseña</label><input id="password" type="password" autocomplete="current-password" placeholder="tu contraseña" required>
   <button class="btn primary" type="submit">entrar</button>
  </form>
  <div class="auth-error" id="authError"></div>
 </div>
</div>

<main id="app" class="hidden">
 <header>
  <img class="logo" src="logo.png" alt="RO PONCE" onerror="this.outerHTML='<h1 class=&quot;logo-fallback&quot;>RO <i>PONCE</i></h1>'">
  <div class="meta"><span class="dot"></span><span>dj</span><span id="today"></span></div>
  <div class="cats"><span data-cat="phones" data-s="2"></span><span data-cat="beer" data-s="2"></span><span data-cat="vinyl" data-s="2"></span><span data-cat="heart" data-s="2"></span></div>
 </header>

 <section class="track">
  <div class="eyebrow">track del día</div>
  <div class="track-title" id="trackTitle" role="button" tabindex="0" aria-label="Editar track del día">¿Qué estamos escuchando hoy?</div>
  <div class="track-meta" id="trackArtist" role="button" tabindex="0" aria-label="Editar artista del track">tocá acá para cargar el track</div>
  <a class="btn primary track-open hidden" id="trackOpen" href="#" target="_blank" rel="noopener">escuchar</a>
  <div class="track-edit hidden" id="trackEditor">
   <input id="trackName" placeholder="nombre del track" maxlength="120">
   <input id="trackBy" placeholder="artista / DJ" maxlength="120">
   <input id="trackUrl" type="url" inputmode="url" placeholder="link de Spotify, SoundCloud, YouTube…">
   <div class="actions"><button class="btn primary" id="saveTrack" type="button">guardar</button><button class="btn" id="cancelTrack" type="button">cancelar</button></div>
  </div>
 </section>

 <section class="section">
  <div class="section-head">
   <div class="sh-title"><span data-cat="vinyl" data-s="2"></span><h2>re<em>cursos</em></h2><span data-cat="phones" data-s="2"></span></div>
   <button class="btn" id="editLinks" type="button">editar links</button>
  </div>
  <div class="resource-grid" id="resourceGrid"></div>
 </section>

 <section class="section">
  <div class="section-head">
   <div class="sh-title"><span data-cat="beer" data-s="2"></span><h2>fe<em>chas</em></h2><span data-cat="heart" data-s="2"></span></div>
   <div class="sh-tools"><span class="count" id="count">00</span><button class="add" id="showForm" type="button" aria-label="Agregar fecha">+</button></div>
  </div>
  <form id="gigForm" class="hidden" autocomplete="off">
   <div class="field"><label for="fDate">fecha</label><input type="date" id="fDate" required></div>
   <div class="field"><label for="fPlace">lugar</label><input type="text" id="fPlace" required maxlength="100"></div>
   <div class="field full"><label for="fLine">line up</label><input type="text" id="fLine" maxlength="180"></div>
   <div class="actions"><button type="submit" class="btn primary" id="submitGig">cargar</button><button type="button" class="btn" id="cancelGig">cancelar</button></div>
  </form>
  <ul class="gigs" id="gigs"></ul>
 </section>

 <footer>
  <div class="cats" style="margin-top:0"><span data-cat="heart" data-s="2"></span><span data-cat="phones" data-s="2"></span><span data-cat="beer" data-s="2"></span></div>
  <button id="logout" type="button">salir</button>
 </footer>
 <div class="sync-status" id="syncStatus">sincronización compartida</div>
</main>

<div class="modal hidden" id="reminder" role="dialog" aria-modal="true" aria-labelledby="reminderTitle">
 <div class="modal-card">
  <div class="modal-kicker" id="reminderTitle">friendly reminder</div>
  <div class="cats"><span data-cat="phones" data-s="3"></span><span data-cat="heart" data-s="3"></span><span data-cat="beer" data-s="3"></span></div>
  <div class="modal-message">¿sos la dj más linda y talentosa del planeta?</div>
  <div class="modal-buttons"><div id="nopSlot"><button class="btn" id="nop" type="button">nop</button></div><button class="btn" id="ofquers" type="button">ofquers</button></div>
 </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
 /* ---------- gatitos pixel art ---------- */
 const COL={F:'#fffaf6',f:'#e9dcdf',O:'#2d2a45',E:'#2d2a45',M:'#2d2a45',P:'#ec6f88',B:'#f7b0c4',N:'#c9506f',H:'#8f6fe0',u:'#bba9f6',R:'#e8386f',W:'#ffffff',Y:'#f3b838',y:'#fbd77a',V:'#34304a',v:'#5d5780',h:'#fbf5f1'};
 const HEAD={9:".....OO......",10:"....OPPO.....",11:"....OPPPO....",12:"....OPFFFOOOO",13:"...OFFFFFFFFF",14:"...OFFFFFFFFF",15:"...OFFFEFFFFF",16:"...OFFEFEFFFF",17:"OOOOFBBFFFFFN",18:"...OFFFFFFFMF",19:".OOOFFFFFFFFF",20:"...OFFFFFFFFF",21:"....Offffffff",22:".....OOOOOOOO"};
 const mir=h=>{h=h.padEnd(13,'.').slice(0,13);return h+h.slice(0,12).split('').reverse().join('')};
 const PH=[[4,"......OOOOOOO"],[5,"....OOHHHHHHH"],[6,"..OOHHHHHHHHH"],[7,".OHHHHOOOOOOO"],[8,"OHHHOO......."]];
 for(let r=9;r<=14;r++)PH.push([r,"OHHO........."]);
 PH.push([15,".OOOO........"],[16,"OHuHHO......."],[17,"OHuHHO......."],[18,"OHHHHO......."],[19,"OHHHHO......."],[20,"OHHHHO......."],[21,".OOOO........"]);
 PH.forEach(p=>p.push(true));
 const HT=[".OOO...OOO.","ORRRO.ORRRO","ORWRROORRRO","ORRRRRRRRRO",".ORRRRRRRO.","..ORRRRRO..","...ORRRO...","....ORO....",".....O....."].map((h,i)=>[1+i,'.'.repeat(7)+h]);
 const BR=[".OOOOOOO.","OWWWWWWWO","OWWWWWWWO",".OWWWWWO.",".OYyYYYOOO",".OYyYYYO.O",".OYyYYYO.O",".OYYYYYOOO",".OYYYYYO.",".OOOOOOO."].map((m,i)=>[2+i,'.'.repeat(8)+m]);
 const VN=["....OOO","..OVVVV",".OVVvvv","OVVvVVV","OVvVVBB","OVvVBBB","OVvVBBh","OVvVBBB","OVvVVBB","OVVvVVV",".OVVvvv","..OVVVV","....OOO"].map((d,i)=>[21+i,'......'+d,true]);
 const SPR={phones:PH,vinyl:VN,beer:BR,heart:HT},TYPES=Object.keys(SPR);
 function mkCat(over){
  const g=Array.from({length:34},()=>Array(25).fill('.'));
  for(const r in HEAD){const s=mir(HEAD[r]);for(let x=0;x<25;x++)if(s[x]!=='.')g[r][x]=s[x]}
  over.forEach(([r,s,half])=>{s=half?mir(s):s.padEnd(25,'.');for(let x=0;x<25;x++)if(s[x]!=='.')g[r][x]=s[x]});
  const rows=g.map(a=>a.join('')),has=r=>/[^.]/.test(r);
  const top=rows.findIndex(has);let bot=rows.length-1;while(bot>0&&!has(rows[bot]))bot--;
  const h=bot-top+1,c=document.createElement('canvas');c.width=25;c.height=h;const x=c.getContext('2d');
  for(let y=0;y<h;y++)for(let i=0;i<25;i++){const k=rows[top+y][i];if(k!=='.'){x.fillStyle=COL[k];x.fillRect(i,y,1,1)}}
  return {url:c.toDataURL(),w:25,h};
 }
 const IMG={};TYPES.forEach(t=>IMG[t]=mkCat(SPR[t]));
 const catImg=(t,s)=>{const c=IMG[t];return `<img class="cat" src="${c.url}" width="${c.w*s}" height="${c.h*s}" alt="" aria-hidden="true" style="animation-delay:-${(Math.random()*3).toFixed(1)}s">`};
 window.catImg=catImg;
 window.paintCats=root=>root.querySelectorAll('[data-cat]').forEach(e=>{e.innerHTML=catImg(e.dataset.cat,+e.dataset.s||2)});
 paintCats(document);
 const $decor=document.getElementById('decor');
 [['phones',3,7,2],['heart',88,12,2],['beer',2,34,2],['vinyl',90,41,2],['heart',4,58,2],['phones',88,66,2],['vinyl',3,80,2],['beer',87,88,2],['heart',45,95,2]].forEach(([t,l,tp,s])=>{
  const w=document.createElement('span');w.className='dc';w.style.cssText=`position:absolute;left:${l}%;top:${tp}%;opacity:.5`;w.innerHTML=catImg(t,s);$decor.appendChild(w);
 });
})();
</script>
<script>
(() => {
 const SUPABASE_URL='https://nfnfdshptlvqdsnsmblz.supabase.co';
 const SUPABASE_KEY='sb_publishable_D11ZF8oTDfPuieZd3WzcIg_6XkghZd8';
 const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 const $=s=>document.querySelector(s);
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const TABLE='roponce_shared';
 const RES=[{id:'soundcloud',n:'SoundCloud'},{id:'mixcloud',n:'Mixcloud'},{id:'whatsapp',n:'WhatsApp'},{id:'instagram',n:'Instagram'},{id:'presskit',n:'Presskit'},{id:'fotos',n:'Fotos'}];
 const DOW=['dom','lun','mar','mié','jue','vie','sáb'],MON=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
 let shared={gigs:[],links:{},track:{title:'',artist:'',url:''}},editingLinks=false,editId=null,channel=null,saveTimer=null,appReady=false;
 const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
 const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
 const endWeek=()=>{const d=today0();d.setDate(d.getDate()+((7-d.getDay())%7));return d};
 function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1700)}
 function status(m){$('#syncStatus').textContent=m}
 function cleanData(v){return {gigs:Array.isArray(v?.gigs)?v.gigs:[],links:v?.links&&typeof v.links==='object'?v.links:{},track:v?.track&&typeof v.track==='object'?v.track:{title:'',artist:'',url:''}}}
 function renderTrack(){
  const t=shared.track||{};
  $('#trackTitle').textContent=t.title||'¿Qué estamos escuchando hoy?';
  $('#trackArtist').textContent=t.artist||'tocá acá para cargar el track';
  $('#trackOpen').classList.toggle('hidden',!t.url);
  if(t.url)$('#trackOpen').href=t.url;
  $('#trackName').value=t.title||'';$('#trackBy').value=t.artist||'';$('#trackUrl').value=t.url||'';
 }
 function renderResources(){
  $('#resourceGrid').innerHTML=RES.map(r=>{
   const url=shared.links[r.id]||'';
   if(editingLinks)return `<div class="resource-edit"><label>${r.n}</label><input type="url" inputmode="url" data-link="${r.id}" placeholder="pegá el link" value="${esc(url)}"></div>`;
   return `<button class="resource" data-resource="${r.id}" type="button"><span>${r.n}</span><small>${url?'abrir link':'sin link todavía'}</small></button>`;
  }).join('');
 }
 function renderGigs(){
  const today=today0(),weekEnd=endWeek();
  const sorted=[...shared.gigs].sort((a,b)=>{const ap=parse(a.date)<today,bp=parse(b.date)<today;if(ap!==bp)return ap?1:-1;return ap?b.date.localeCompare(a.date):a.date.localeCompare(b.date)});
  $('#count').textContent=String(shared.gigs.filter(g=>parse(g.date)>=today).length).padStart(2,'0');
  $('#gigs').innerHTML=sorted.length?sorted.map((g,i)=>{
   const d=parse(g.date),past=d<today,inWeek=!past&&d<=weekEnd;
   return `<li class="gig ${past?'past':''} ${inWeek?'thisweek':''}"><span class="gcat">${catImg(['phones','beer','vinyl','heart'][i%4],2)}</span><div class="day">${d.getDate()}</div><div class="dmeta">${DOW[d.getDay()]} ${MON[d.getMonth()]}</div><div class="gig-place">${esc(g.place)}</div>${g.lineup?`<div class="gig-lineup">${esc(g.lineup)}</div>`:''}<div class="gig-actions"><button type="button" data-edit="${g.id}" aria-label="Editar fecha">✎</button><button type="button" data-delete="${g.id}" aria-label="Eliminar fecha">×</button></div></li>`;
  }).join(''):'<li class="empty"><span data-cat="heart" data-s="3"></span>sin fechas todavía</li>';
  paintCats($('#gigs'));
 }
 function renderAll(){renderTrack();renderResources();renderGigs()}
 async function loadShared(){
  status('conectando con la base compartida…');
  const {data:row,error}=await db.from(TABLE).select('data').eq('id',1).maybeSingle();
  if(error){console.error(error);status('no se pudo leer: '+error.message);toast('revisá la configuración SQL');return false}
  if(row?.data)shared=cleanData(row.data);
  else{
   const {error:ie}=await db.from(TABLE).insert({id:1,data:shared});
   if(ie){console.error(ie);status('no se pudo iniciar: '+ie.message);toast('revisá permisos de Supabase');return false}
  }
  renderAll();status('sincronización activa');
  if(channel)await db.removeChannel(channel);
  channel=db.channel('roponce-live').on('postgres_changes',{event:'*',schema:'public',table:TABLE,filter:'id=eq.1'},p=>{
   if(p.new?.data){shared=cleanData(p.new.data);renderAll();status('actualizado en vivo')}
  }).subscribe(s=>{if(s==='CHANNEL_ERROR')status('sin conexión en tiempo real')});
  return true;
 }
 async function saveShared(){
  status('guardando cambios…');
  const {data,error}=await db.from(TABLE).upsert({id:1,data:shared,updated_at:new Date().toISOString()},{onConflict:'id'}).select('id');
  if(error||!data||!data.length){const m=error?error.message:'sin permisos para escribir en la tabla';console.error(error||m);status('no se guardó: '+m);toast('no se pudo guardar');return false}
  status('guardado en la base compartida');return true;
 }
 function queueSave(now){clearTimeout(saveTimer);if(now)return saveShared();saveTimer=setTimeout(saveShared,350)}

 /* ---------- pop-up: el nop se escapa por toda la pantalla ---------- */
 function resetNop(){const b=$('#nop');b.style.position='';b.style.left='';b.style.top='';b.style.zIndex=''}
 function openReminder(){resetNop();$('#reminder').classList.remove('hidden')}
 $('#ofquers').addEventListener('click',()=>$('#reminder').classList.add('hidden'));
 $('#nop').addEventListener('click',()=>{
  const b=$('#nop'),r=b.getBoundingClientRect(),w=b.offsetWidth,h=b.offsetHeight,m=12;
  const maxX=Math.max(0,innerWidth-w-m*2),maxY=Math.max(0,innerHeight-h-m*2);
  let x,y,n=0;
  do{x=m+Math.random()*maxX;y=m+Math.random()*maxY;n++}while(n<25&&Math.hypot(x-r.left,y-r.top)<120);
  b.style.position='fixed';b.style.zIndex=95;b.style.left=x+'px';b.style.top=y+'px';
 });

 /* ---------- fechas ---------- */
 $('#showForm').addEventListener('click',()=>{$('#gigForm').classList.toggle('hidden');if(!$('#gigForm').classList.contains('hidden'))$('#fDate').focus()});
 function resetGig(){editId=null;$('#gigForm').reset();$('#submitGig').textContent='cargar';$('#gigForm').classList.add('hidden')}
 $('#cancelGig').addEventListener('click',resetGig);
 $('#gigForm').addEventListener('submit',e=>{
  e.preventDefault();
  const g={date:$('#fDate').value,place:$('#fPlace').value.trim(),lineup:$('#fLine').value.trim()};
  if(!g.date||!g.place)return;
  const was=Boolean(editId);
  if(was)shared.gigs=shared.gigs.map(x=>x.id===editId?{...x,...g}:x);
  else shared.gigs.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),...g});
  resetGig();renderGigs();queueSave(true);toast(was?'fecha actualizada':'fecha cargada');
 });
 $('#gigs').addEventListener('click',e=>{
  const ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');
  if(ed){const g=shared.gigs.find(x=>x.id===ed.dataset.edit);if(!g)return;editId=g.id;$('#fDate').value=g.date;$('#fPlace').value=g.place;$('#fLine').value=g.lineup||'';$('#submitGig').textContent='guardar';$('#gigForm').classList.remove('hidden');$('#gigForm').scrollIntoView({behavior:'smooth',block:'center'})}
  if(del){const g=shared.gigs.find(x=>x.id===del.dataset.delete);if(!g||!confirm(`¿eliminar ${g.place}?`))return;shared.gigs=shared.gigs.filter(x=>x.id!==g.id);renderGigs();queueSave(true);toast('fecha eliminada')}
 });

 /* ---------- links y track ---------- */
 $('#editLinks').addEventListener('click',()=>{editingLinks=!editingLinks;$('#editLinks').textContent=editingLinks?'listo':'editar links';renderResources();if(!editingLinks)queueSave(true)});
 $('#resourceGrid').addEventListener('input',e=>{const id=e.target.dataset.link;if(!id)return;shared.links[id]=e.target.value.trim();queueSave()});
 $('#resourceGrid').addEventListener('click',e=>{const b=e.target.closest('[data-resource]');if(!b)return;const url=shared.links[b.dataset.resource];if(!url){toast('todavía sin link');return}window.open(url,'_blank','noopener')});
 const openEditor=()=>$('#trackEditor').classList.remove('hidden');
 $('#trackTitle').addEventListener('click',openEditor);
 $('#trackArtist').addEventListener('click',openEditor);
 ['#trackTitle','#trackArtist'].forEach(sel=>$(sel).addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openEditor();$('#trackName').focus()}}));
 $('#saveTrack').addEventListener('click',()=>{
  const url=$('#trackUrl').value.trim();
  if(url&&!/^https?:\/\//i.test(url)){toast('el link debe empezar con https://');return}
  shared.track={title:$('#trackName').value.trim(),artist:$('#trackBy').value.trim(),url};
  renderTrack();$('#trackEditor').classList.add('hidden');queueSave(true);toast('track compartido');
 });
 $('#cancelTrack').addEventListener('click',()=>$('#trackEditor').classList.add('hidden'));

 /* ---------- sesión ---------- */
 $('#logout').addEventListener('click',async()=>{if(channel)await db.removeChannel(channel);await db.auth.signOut()});
 $('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();$('#authError').textContent='entrando…';
  const {error}=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});
  if(error){$('#authError').textContent='No pudimos entrar. Revisá el email y la contraseña.';return}
  await showApp();
 });
 async function showApp(){
  if(appReady)return;appReady=true;
  $('#authScreen').classList.add('hidden');$('#app').classList.remove('hidden');
  const n=new Date();$('#today').textContent=`${DOW[n.getDay()]} ${n.getDate()} ${MON[n.getMonth()]}`;
  const ok=await loadShared();if(ok)openReminder();
 }
 db.auth.getSession().then(async({data})=>{if(data.session)await showApp()});
 db.auth.onAuthStateChange(async ev=>{if(ev==='SIGNED_OUT'){appReady=false;location.reload()}});
})();
</script>
</body>
</html>
